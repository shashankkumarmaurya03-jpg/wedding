            </div>

        </div>

    `;

    document.body.appendChild(saveDate);

/* =========================
   SCRATCH
========================= */

function setupScratch(){

    const canvas =
        document.getElementById("scratchCanvas");

    const container =
        document.querySelector(".scratch-container");

    const ctx =
        canvas.getContext("2d");

    const rect =
        container.getBoundingClientRect();

    const width =
        Math.floor(rect.width);

    const height =
        Math.floor(rect.height);

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.scale(dpr,dpr);


    const gradient =
        ctx.createLinearGradient(
            0,0,width,height
        );

    gradient.addColorStop(
        0,
        "#5a4632"
    );

    gradient.addColorStop(
        .5,
        "#8b7355"
    );

    gradient.addColorStop(
        1,
        "#4a3828"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    ctx.fillStyle =
        "rgba(255,255,255,.18)";

    ctx.font =
        "12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "SCRATCH TO REVEAL",
        width/2,
        height/2-25
    );


    let scratching = false;

    let scratchedPoints = 0;

    let completed = false;

    const totalRequired = 70;


    function getPosition(event){

        const bounds =
            canvas.getBoundingClientRect();

        let clientX;
        let clientY;

        if(
            event.touches &&
            event.touches.length
        ){

            clientX =
                event.touches[0].clientX;

            clientY =
                event.touches[0].clientY;

        }else{

            clientX =
                event.clientX;

            clientY =
                event.clientY;

        }

        return {

            x:
                clientX -
                bounds.left,

            y:
                clientY -
                bounds.top

        };

    }


    function scratch(event){

        if(!scratching) return;

        event.preventDefault();

        const position =
            getPosition(event);

        ctx.globalCompositeOperation =
            "destination-out";

        ctx.beginPath();

        ctx.arc(
            position.x,
            position.y,
            28,
            0,
            Math.PI * 2
        );

        ctx.fill();

        scratchedPoints++;


        if(
            scratchedPoints >= totalRequired &&
            !completed
        ){

            completed = true;

            canvas.style.transition =
                "opacity .8s ease";

            canvas.style.opacity =
                "0";


            const hint =
                document.querySelector(
                    ".scratch-hint"
                );

            if(hint){
                hint.style.opacity = "0";
            }


            setTimeout(function(){

                saveDate.style.transition =
                    "opacity 1.2s ease";

                saveDate.style.opacity =
                    "0";

                setTimeout(function(){

                    saveDate.remove();

                    showEvents();

                },1200);

            },800);

        }

    }


    canvas.addEventListener(
        "mousedown",
        function(event){

            scratching = true;

            scratch(event);

        }
    );


    canvas.addEventListener(
        "mousemove",
        scratch
    );


    window.addEventListener(
        "mouseup",
        function(){

            scratching = false;

        }
    );


    canvas.addEventListener(
        "touchstart",
        function(event){

            scratching = true;

            scratch(event);

        },
        {passive:false}
    );


    canvas.addEventListener(
        "touchmove",
        scratch,
        {passive:false}
    );


    window.addEventListener(
        "touchend",
        function(){

            scratching = false;

        }
    );

}

/* =========================
   COUNTDOWN
========================= */

function startCountdown(){

    const target =
        new Date(
            "November 21, 2026 10:00:00"
        ).getTime();


    setInterval(function(){

        const now =
            new Date().getTime();

        const distance =
            target - now;


        if(distance <= 0){

            document.getElementById("days")
                .innerText = "00";

            document.getElementById("hours")
                .innerText = "00";

            document.getElementById("mins")
                .innerText = "00";

            document.getElementById("secs")
                .innerText = "00";

            return;

        }


        const days =
            Math.floor(
                distance /
                (1000*60*60*24)
            );

        const hours =
            Math.floor(
                (distance %
                (1000*60*60*24)) /
                (1000*60*60)
            );

        const mins =
            Math.floor(
                (distance %
                (1000*60*60)) /
                (1000*60)
            );

        const secs =
            Math.floor(
                (distance %
                (1000*60)) /
                1000
            );


        document.getElementById("days")
            .innerText =
            String(days).padStart(2,"0");

        document.getElementById("hours")
            .innerText =
            String(hours).padStart(2,"0");

        document.getElementById("mins")
            .innerText =
            String(mins).padStart(2,"0");

        document.getElementById("secs")
            .innerText =
            String(secs).padStart(2,"0");

    },1000);

}
