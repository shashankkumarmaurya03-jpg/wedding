<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shashank & Jyoti | Wedding Invitation</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #0b0806;
            color: #ffffff;
            font-family: Georgia, "Times New Roman", serif;
        }


        /* =========================================
           OPENING SCREEN
        ========================================= */

        .opening {

            position: relative;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    rgba(120, 80, 35, 0.25),
                    rgba(0, 0, 0, 0.96) 75%
                ),
                linear-gradient(
                    135deg,
                    #21160d,
                    #080706 55%,
                    #160e08
                );

            opacity: 1;

            transform: scale(1);
        }


        /* Cinematic Glow */

        .opening::before {

            content: "";

            position: absolute;

            width: 80vw;
            height: 80vw;

            max-width: 700px;
            max-height: 700px;

            border-radius: 50%;

            background:
                rgba(180, 130, 70, 0.08);

            filter: blur(80px);

            animation:
                glow 5s ease-in-out infinite alternate;
        }


        /* Opening Content */

        .opening-content {

            position: relative;

            z-index: 2;

            width: 90%;

            max-width: 750px;

            animation:
                fadeUp 1.8s ease forwards;
        }


        /* Ganesh */

        .ganesh {

            font-size: 18px;

            letter-spacing: 2px;

            margin-bottom: 22px;

            opacity: 0.95;
        }


        /* Mantra */

        .mantra {

            font-size: 15px;

            line-height: 2;

            letter-spacing: 0.5px;

            margin-bottom: 35px;

            opacity: 0.85;
        }


        /* Invitation */

        .invite {

            font-family: Arial, sans-serif;

            font-size: 11px;

            letter-spacing: 3px;

            text-transform: uppercase;

            opacity: 0.7;

            margin-bottom: 20px;
        }


        /* Names */

        .names {

            font-size:
                clamp(32px, 8vw, 68px);

            font-weight: normal;

            letter-spacing: 2px;

            line-height: 1.15;

            margin-bottom: 15px;

            text-shadow:
                0 4px 25px rgba(0,0,0,0.8);
        }


        .ampersand {

            font-style: italic;

            font-size: 0.55em;

            margin: 0 8px;

            opacity: 0.8;
        }


        /* Subtitle */

        .subtitle {

            font-family: Arial, sans-serif;

            font-size: 10px;

            letter-spacing: 4px;

            opacity: 0.65;

            margin-bottom: 45px;
        }


        /* Open Button */

        .open-btn {

            border:
                1px solid rgba(255,255,255,0.5);

            background:
                rgba(255,255,255,0.05);

            color: white;

            padding:
                15px 32px;

            font-family:
                Arial, sans-serif;

            font-size: 11px;

            letter-spacing: 3px;

            cursor: pointer;

            transition:
                all 0.4s ease;

            backdrop-filter:
                blur(5px);
        }


        .open-btn:hover {

            background:
                rgba(255,255,255,0.15);

            border-color:
                white;

            transform:
                scale(1.04);
        }


        .open-btn:active {

            transform:
                scale(0.97);
        }


        /* Bottom Date */

        .bottom-line {

            position: absolute;

            bottom: 25px;

            left: 50%;

            transform:
                translateX(-50%);

            font-family:
                Arial, sans-serif;

            font-size: 9px;

            letter-spacing: 3px;

            opacity: 0.35;

            z-index: 2;

            white-space: nowrap;
        }


        /* =========================================
           INVITATION SECTION
        ========================================= */

        .invitation-section {

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 35px;

            background:

                radial-gradient(
                    circle at center,
                    rgba(120, 80, 35, 0.20),
                    #0b0806 70%
                );

            animation:
                invitationFade 2s ease forwards;
        }


        /* First line */

        .invitation-small {

            font-family:
                Arial, sans-serif;

            font-size: 12px;

            letter-spacing: 1px;

            line-height: 1.8;

            opacity: 0.7;

            margin-bottom: 18px;

            max-width: 650px;
        }


        /* Second line */

        .invitation-text {

            font-size: 18px;

            line-height: 1.7;

            opacity: 0.9;

            margin-bottom: 45px;

            max-width: 650px;
        }


        /* Couple Names */

        .couple-name {

            font-size:
                clamp(48px, 10vw, 90px);

            letter-spacing: 3px;

            line-height: 1.1;

            font-weight: normal;

            text-shadow:
                0 5px 30px rgba(0,0,0,0.8);
        }


        /* & */

        .couple-and {

            font-size: 30px;

            font-style: italic;

            margin:
                15px 0;

            opacity: 0.7;
        }


        /* =========================================
           ANIMATIONS
        ========================================= */

        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(30px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes glow {

            from {

                transform:
                    scale(0.9);

                opacity: 0.5;
            }

            to {

                transform:
                    scale(1.1);

                opacity: 1;
            }
        }


        @keyframes invitationFade {

            from {

                opacity: 0;

                transform:
                    scale(0.97);
            }

            to {

                opacity: 1;

                transform:
                    scale(1);
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {


            .ganesh {

                font-size: 16px;

                margin-bottom: 16px;
            }


            .mantra {

                font-size: 13px;

                line-height: 1.8;

                margin-bottom: 28px;
            }


            .invite {

                font-size: 9px;

                letter-spacing: 2px;

                line-height: 1.7;
            }


            .names {

                font-size: 34px;

                letter-spacing: 1px;
            }


            .subtitle {

                font-size: 9px;

                letter-spacing: 3px;

                margin-bottom: 35px;
            }


            .open-btn {

                padding:
                    14px 25px;

                font-size: 10px;

                letter-spacing: 2px;
            }


            .bottom-line {

                bottom: 18px;

                font-size: 8px;

                letter-spacing: 2px;
            }


            .invitation-section {

                padding:
                    25px 20px;
            }


            .invitation-small {

                font-size: 11px;

                line-height: 1.7;
            }


            .invitation-text {

                font-size: 16px;

                line-height: 1.7;

                margin-bottom: 38px;
            }


            .couple-name {

                font-size: 50px;

                letter-spacing: 2px;
            }


            .couple-and {

                font-size: 25px;

                margin:
                    12px 0;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         OPENING
    ========================================= -->

    <section
        class="opening"
        id="opening">


        <div
            class="opening-content">


            <div class="ganesh">

                ॥ श्री गणेशाय नमः ॥

            </div>


            <div class="mantra">

                वक्रतुण्ड महाकाय सूर्यकोटि समप्रभ।<br>

                निर्विघ्नं कुरु मे देव सर्वकार्येषु सर्वदा॥

            </div>


            <div class="invite">

                With the blessings of Shri Ganesh
                and our beloved families

            </div>


            <div class="names">

                Shashank

                <span class="ampersand">
                    &
                </span>

                Jyoti

            </div>


            <div class="subtitle">

                WEDDING INVITATION

            </div>


            <button
                class="open-btn"
                id="openInvitation">

                OPEN INVITATION

            </button>


        </div>


        <div class="bottom-line">

            21 NOVEMBER 2026

        </div>


    </section>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>


        const openButton =
            document.getElementById(
                "openInvitation"
            );


        const opening =
            document.getElementById(
                "opening"
            );


        openButton.addEventListener(
            "click",
            function () {


                /* Opening transition */

                opening.style.transition =
                    "opacity 1.5s ease, transform 1.5s ease";


                opening.style.opacity =
                    "0";


                opening.style.transform =
                    "scale(1.04)";


                /* Show invitation */

                setTimeout(
                    function () {


                        opening.style.display =
                            "none";


                        document.body.style.overflow =
                            "auto";


                        const invitation =
                            document.createElement(
                                "section"
                            );


                        invitation.className =
                            "invitation-section";


                        invitation.innerHTML = `

                            <div class="invitation-small">

                                With the blessings of Shri Ganesh
                                and our beloved families,

                            </div>


                            <div class="invitation-text">

                                we joyfully invite you
                                to celebrate the union of

                            </div>


                            <div class="couple-name">

                                Shashank

                            </div>


                            <div class="couple-and">

                                &

                            </div>


                            <div class="couple-name">

                                Jyoti

                            </div>

                        `;


                        document.body.appendChild(
                            invitation
                        );


                    },
                    1500
                );

            }
        );

    </script>


</body>
</html>
