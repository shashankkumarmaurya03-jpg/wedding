<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Shashank & Jyoti | Wedding Invitation</title>


<style>

/* ==================================================
   FONT SETTINGS
================================================== */

:root {

    --main-font:
        "Boring's",
        "Boring",
        Georgia,
        "Times New Roman",
        serif;

    --event-font:
        "Brigovin",
        "Brigovin Regular",
        Georgia,
        "Times New Roman",
        serif;

}


/* ==================================================
   BASIC
================================================== */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}


html,
body {

    width: 100%;

    min-height: 100%;

}


body {

    background: #0b0806;

    color: #ffffff;

    font-family: var(--main-font);

}


/* ==================================================
   OPENING
================================================== */

.opening {

    position: relative;

    width: 100%;

    height: 100vh;

    height: 100dvh;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    overflow: hidden;

    padding:
        20px;

    background:

        radial-gradient(
            circle at center,
            rgba(120, 80, 35, 0.25),
            rgba(0, 0, 0, 0.96) 75%
        ),

        linear-gradient(
            135deg,
            #21160d,
            #080706 55%,
            #160e08
        );

    opacity: 1;

    transform: scale(1);

}


/* ==================================================
   GLOW
================================================== */

.opening::before {

    content: "";

    position: absolute;

    width: 80vw;

    height: 80vw;

    max-width: 700px;

    max-height: 700px;

    border-radius: 50%;

    background:
        rgba(180, 130, 70, 0.08);

    filter: blur(80px);

    animation:
        glow 5s ease-in-out infinite alternate;

}


/* ==================================================
   OPENING CONTENT
================================================== */

.opening-content {

    position: relative;

    z-index: 2;

    width: 100%;

    max-width: 700px;

    margin: 0 auto;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    animation:
        fadeUp 1.8s ease forwards;

}


/* ==================================================
   GANESH
================================================== */

.ganesh {

    font-family:
        var(--main-font);

    font-size:
        clamp(17px, 2.5vw, 21px);

    font-weight: 400;

    letter-spacing: 0.5px;

    line-height: 1.35;

    margin-bottom: 12px;

    opacity: 0.95;

    width: 100%;

    text-align: center;

}


/* ==================================================
   MANTRA
================================================== */

.mantra {

    font-family:
        var(--main-font);

    font-size:
        clamp(13px, 1.8vw, 16px);

    font-weight: 400;

    letter-spacing: 0;

    line-height: 1.65;

    margin-bottom: 22px;

    opacity: 0.85;

    width: 100%;

    max-width: 650px;

    text-align: center;

}


/* ==================================================
   INVITE
================================================== */

.invite {

    font-family:
        var(--main-font);

    font-size:
        clamp(10px, 1.5vw, 12px);

    font-weight: 400;

    letter-spacing: 1.8px;

    line-height: 1.55;

    text-transform: uppercase;

    opacity: 0.72;

    margin-bottom: 10px;

    width: 100%;

    max-width: 620px;

    text-align: center;

}


/* ==================================================
   COUPLE NAMES
================================================== */

.names {

    font-family:
        var(--main-font);

    font-size:
        clamp(43px, 8vw, 72px);

    font-weight: 400;

    letter-spacing: 1px;

    line-height: 1;

    margin-bottom: 8px;

    width: 100%;

    text-align: center;

    text-shadow:
        0 4px 25px rgba(0,0,0,0.8);

}


/* ==================================================
   AMPERSAND
================================================== */

.ampersand {

    display: inline-block;

    font-family:
        var(--main-font);

    font-style: italic;

    font-size: 0.48em;

    margin:
        0 8px;

    opacity: 0.8;

    vertical-align: middle;

}


/* ==================================================
   SUBTITLE
================================================== */

.subtitle {

    font-family:
        var(--main-font);

    font-size: 10px;

    font-weight: 400;

    letter-spacing: 3px;

    line-height: 1.3;

    opacity: 0.65;

    margin-bottom: 25px;

    width: 100%;

    text-align: center;

}


/* ==================================================
   OPEN BUTTON
================================================== */

.open-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 180px;

    height: 46px;

    padding:
        0 25px;

    border:
        1px solid rgba(255,255,255,0.5);

    background:
        rgba(255,255,255,0.05);

    color: #ffffff;

    font-family:
        var(--main-font);

    font-size: 10px;

    font-weight: 400;

    letter-spacing: 2.5px;

    line-height: 1;

    cursor: pointer;

    transition:
        all 0.4s ease;

    backdrop-filter:
        blur(5px);

}


.open-btn:hover {

    background:
        rgba(255,255,255,0.15);

    border-color:
        #ffffff;

    transform:
        scale(1.04);

}


.open-btn:active {

    transform:
        scale(0.97);

}


/* ==================================================
   BOTTOM DATE
================================================== */

.bottom-line {

    position: absolute;

    bottom: 17px;

    left: 50%;

    transform:
        translateX(-50%);

    font-family:
        var(--main-font);

    font-size: 8px;

    letter-spacing: 2.5px;

    line-height: 1.3;

    opacity: 0.35;

    z-index: 2;

    white-space: nowrap;

    text-align: center;

}


/* ==================================================
   INVITATION SECTION
================================================== */

.invitation-section {

    min-height: 100vh;

    min-height: 100dvh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        25px 20px;

    background:

        radial-gradient(
            circle at center,
            rgba(120, 80, 35, 0.20),
            #0b0806 70%
        );

    animation:
        invitationFade 1.5s ease forwards;

}


/* ==================================================
   INVITATION SMALL
================================================== */

.invitation-small {

    font-family:
        var(--main-font);

    font-size: 12px;

    letter-spacing: 0.7px;

    line-height: 1.55;

    opacity: 0.72;

    margin-bottom: 10px;

    max-width: 600px;

    text-align: center;

}


/* ==================================================
   INVITATION TEXT
================================================== */

.invitation-text {

    font-family:
        var(--main-font);

    font-size: 17px;

    line-height: 1.5;

    opacity: 0.9;

    margin-bottom: 25px;

    max-width: 600px;

    text-align: center;

}


/* ==================================================
   COUPLE NAME
================================================== */

.couple-name {

    font-family:
        var(--main-font);

    font-size:
        clamp(50px, 10vw, 90px);

    letter-spacing: 2px;

    line-height: 0.95;

    font-weight: 400;

    text-align: center;

    text-shadow:
        0 5px 30px rgba(0,0,0,0.8);

}


/* ==================================================
   COUPLE &
================================================== */

.couple-and {

    font-family:
        var(--main-font);

    font-size: 27px;

    font-style: italic;

    line-height: 1;

    margin:
        8px 0;

    opacity: 0.7;

    text-align: center;

}


/* ==================================================
   SAVE DATE
================================================== */

.save-date {

    min-height: 100vh;

    min-height: 100dvh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        25px 20px;

    background:

        radial-gradient(
            circle at center,
            rgba(130, 85, 35, 0.22),
            #090705 72%
        );

    animation:
        saveDateFade 1.5s ease forwards;

}


/* ==================================================
   SAVE TITLE
================================================== */

.save-title {

    font-family:
        var(--event-font);

    font-size:
        clamp(22px, 5vw, 30px);

    letter-spacing: 2px;

    line-height: 1;

    opacity: 0.9;

    margin-bottom: 10px;

    text-align: center;

}


/* ==================================================
   SAVE SUBTITLE
================================================== */

.save-subtitle {

    font-family:
        var(--main-font);

    font-size: 15px;

    line-height: 1.45;

    opacity: 0.82;

    margin-bottom: 22px;

    max-width: 420px;

    text-align: center;

}


/* ==================================================
   SCRATCH CARD
================================================== */

.scratch-container {

    position: relative;

    width:
        min(330px, 85vw);

    height: 350px;

    overflow: hidden;

    border:
        1px solid rgba(255,255,255,0.25);

    border-radius: 4px;

    background:

        linear-gradient(
            145deg,
            #17110c,
            #302116,
            #120d09
        );

    box-shadow:
        0 20px 60px rgba(0,0,0,0.55);

}


/* ==================================================
   DATE REVEAL
================================================== */

.date-reveal {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    z-index: 1;

    text-align: center;

}


.date-month {

    font-family:
        var(--main-font);

    font-size: 18px;

    letter-spacing: 6px;

    margin-left: 6px;

    line-height: 1.2;

    opacity: 0.8;

}


.date-day {

    font-family:
        var(--main-font);

    font-size: 95px;

    line-height: 0.9;

    margin:
        10px 0;

    font-weight: 400;

}


.date-year {

    font-family:
        var(--main-font);

    font-size: 19px;

    letter-spacing: 5px;

    margin-left: 5px;

    line-height: 1.2;

    opacity: 0.75;

}


/* ==================================================
   SCRATCH CANVAS
================================================== */

#scratchCanvas {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    z-index: 5;

    cursor: crosshair;

    touch-action: none;

}


/* ==================================================
   SCRATCH HINT
================================================== */

.scratch-hint {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 6;

    pointer-events: none;

    font-family:
        var(--main-font);

    font-size: 11px;

    letter-spacing: 1.8px;

    line-height: 1.3;

    opacity: 0.75;

    width: 90%;

    text-align: center;

}


/* ==================================================
   ANIMATIONS
================================================== */

@keyframes fadeUp {

    from {

        opacity: 0;

        transform:
            translateY(25px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


@keyframes glow {

    from {

        transform:
            scale(0.9);

        opacity: 0.5;

    }

    to {

        transform:
            scale(1.1);

        opacity: 1;

    }

}


@keyframes invitationFade {

    from {

        opacity: 0;

        transform:
            scale(0.98);

    }

    to {

        opacity: 1;

        transform:
            scale(1);

    }

}


@keyframes saveDateFade {

    from {

        opacity: 0;

        transform:
            scale(0.98);

    }

    to {

        opacity: 1;

        transform:
            scale(1);

    }

}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 600px) {


    .opening {

        padding:
            20px 18px;

    }


    .opening-content {

        max-width: 350px;

    }


    .ganesh {

        font-size: 16px;

        line-height: 1.3;

        margin-bottom: 10px;

    }


    .mantra {

        font-size: 12.5px;

        line-height: 1.6;

        margin-bottom: 18px;

    }


    .invite {

        font-size: 8.5px;

        letter-spacing: 1.4px;

        line-height: 1.5;

        margin-bottom: 8px;

    }


    .names {

        font-size: 37px;

        letter-spacing: 0.5px;

        line-height: 0.95;

        margin-bottom: 7px;

    }


    .ampersand {

        font-size: 0.48em;

        margin:
            0 6px;

    }


    .subtitle {

        font-size: 8px;

        letter-spacing: 2.5px;

        line-height: 1.2;

        margin-bottom: 22px;

    }


    .open-btn {

        min-width: 175px;

        height: 45px;

        padding:
            0 20px;

        font-size: 9px;

        letter-spacing: 2px;

    }


    .bottom-line {

        bottom: 15px;

        font-size: 7.5px;

        letter-spacing: 2px;

    }


    .invitation-section {

        padding:
            20px 18px;

    }


    .invitation-small {

        font-size: 10.5px;

        line-height: 1.5;

        margin-bottom: 8px;

        max-width: 330px;

    }


    .invitation-text {

        font-size: 15px;

        line-height: 1.45;

        margin-bottom: 20px;

        max-width: 330px;

    }


    .couple-name {

        font-size: 50px;

        letter-spacing: 1.5px;

        line-height: 0.92;

    }


    .couple-and {

        font-size: 24px;

        margin:
            7px 0;

    }


    .save-date {

        padding:
            20px 18px;

    }


    .save-title {

        font-size: 24px;

        letter-spacing: 1.5px;

        margin-bottom: 8px;

    }


    .save-subtitle {

        font-size: 14px;

        line-height: 1.4;

        max-width: 310px;

        margin-bottom: 20px;

    }


    .scratch-container {

        width: 295px;

        height: 325px;

    }


    .date-month {

        font-size: 16px;

        letter-spacing: 5px;

    }


    .date-day {

        font-size: 88px;

        margin:
            9px 0;

    }


    .date-year {

        font-size: 17px;

        letter-spacing: 4px;

    }

}


/* ==================================================
   HIDE
================================================== */

.hidden {

    display: none !important;

}

</style>

</head>


<body>


<!-- ==================================================
     OPENING
================================================== -->

<section
    class="opening"
    id="opening">


    <div
        class="opening-content">


        <div class="ganesh">

            ॥ श्री गणेशाय नमः ॥

        </div>


        <div class="mantra">

            वक्रतुण्ड महाकाय सूर्यकोटि समप्रभ।<br>

            निर्विघ्नं कुरु मे देव सर्वकार्येषु सर्वदा॥

        </div>


        <div class="invite">

            With the blessings of Shri Ganesh<br>
            and our beloved families

        </div>


        <div class="names">

            Shashank

            <span class="ampersand">

                &

            </span>

            Jyoti

        </div>


        <div class="subtitle">

            WEDDING INVITATION

        </div>


        <button
            class="open-btn"
            id="openInvitation">

            OPEN INVITATION

        </button>


    </div>


    <div class="bottom-line">

        21 NOVEMBER 2026

    </div>


</section>



<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script>


/* ==================================================
   OPEN INVITATION
================================================== */

const openButton =
    document.getElementById(
        "openInvitation"
    );


const opening =
    document.getElementById(
        "opening"
    );


openButton.addEventListener(
    "click",
    function() {


        opening.style.transition =
            "opacity 1.5s ease, transform 1.5s ease";


        opening.style.opacity =
            "0";


        opening.style.transform =
            "scale(1.04)";


        setTimeout(
            function() {


                opening.style.display =
                    "none";


                document.body.style.overflow =
                    "auto";


                showInvitation();


            },
            1500
        );


    }
);



/* ==================================================
   SHOW INVITATION
================================================== */

function showInvitation() {


    const invitation =
        document.createElement(
            "section"
        );


    invitation.className =
        "invitation-section";


    invitation.id =
        "invitationSection";


    invitation.innerHTML = `

        <div class="invitation-small">

            With the blessings of Shri Ganesh<br>
            and our beloved families,

        </div>


        <div class="invitation-text">

            we joyfully invite you<br>
            to celebrate the union of

        </div>


        <div class="couple-name">

            Shashank

        </div>


        <div class="couple-and">

            &

        </div>


        <div class="couple-name">

            Jyoti

        </div>

    `;


    document.body.appendChild(
        invitation
    );


    setTimeout(
        function() {


            invitation.style.transition =
                "opacity 1.2s ease";


            invitation.style.opacity =
                "0";


            setTimeout(
                function() {


                    invitation.remove();


                    showSaveDate();


                },
                1200
            );


        },
        4500
    );

}



/* ==================================================
   SAVE THE DATE
================================================== */

function showSaveDate() {


    const saveDate =
        document.createElement(
            "section"
        );


    saveDate.className =
        "save-date";


    saveDate.id =
        "saveDate";


    saveDate.innerHTML = `

        <div class="save-title">

            SAVE THE DATE

        </div>


        <div class="save-subtitle">

            Scratch below to reveal our wedding date

        </div>


        <div class="scratch-container">


            <div class="date-reveal">


                <div class="date-month">

                    NOVEMBER

                </div>


                <div class="date-day">

                    21

                </div>


                <div class="date-year">

                    2026

                </div>


            </div>


            <canvas
                id="scratchCanvas">
            </canvas>


            <div class="scratch-hint">

                SCRATCH HERE

            </div>


        </div>

    `;


    document.body.appendChild(
        saveDate
    );


    setupScratch();

}



/* ==================================================
   SCRATCH EFFECT
================================================== */

function setupScratch() {


    const canvas =
        document.getElementById(
            "scratchCanvas"
        );


    const container =
        document.querySelector(
            ".scratch-container"
        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    const rect =
        container.getBoundingClientRect();


    const width =
        Math.floor(rect.width);


    const height =
        Math.floor(rect.height);


    const devicePixelRatio =
        window.devicePixelRatio || 1;


    canvas.width =
        width * devicePixelRatio;


    canvas.height =
        height * devicePixelRatio;


    canvas.style.width =
        width + "px";


    canvas.style.height =
        height + "px";


    ctx.scale(
        devicePixelRatio,
        devicePixelRatio
    );


    /* ------------------------------------------
       SCRATCH SURFACE
    ------------------------------------------ */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            width,
            height
        );


    gradient.addColorStop(
        0,
        "#5a4632"
    );


    gradient.addColorStop(
        0.5,
        "#8b7355"
    );


    gradient.addColorStop(
        1,
        "#4a3828"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* ------------------------------------------
       DECORATIVE TEXT
    ------------------------------------------ */

    ctx.fillStyle =
        "rgba(255,255,255,0.18)";


    ctx.font =
        "12px Arial";


    ctx.textAlign =
        "center";


    ctx.fillText(
        "SCRATCH TO REVEAL",
        width / 2,
        height / 2 - 25
    );


    ctx.font =
        "28px Georgia";


    ctx.fillStyle =
        "rgba(255,255,255,0.22)";


    ctx.fillText(
        "21",
        width / 2,
        height / 2 + 25
    );


    let scratching =
        false;


    let scratchedPoints =
        0;


    const totalRequired =
        70;


    /* ------------------------------------------
       POSITION
    ------------------------------------------ */

    function getPosition(event) {


        const bounds =
            canvas.getBoundingClientRect();


        let clientX;

        let clientY;


        if (
            event.touches &&
            event.touches.length
        ) {


            clientX =
                event.touches[0].clientX;


            clientY =
                event.touches[0].clientY;


        } else {


            clientX =
                event.clientX;


            clientY =
                event.clientY;


        }


        return {

            x:
                clientX -
                bounds.left,

            y:
                clientY -
                bounds.top

        };

    }


    /* ------------------------------------------
       SCRATCH
    ------------------------------------------ */

    function scratch(event) {


        if (!scratching) {

            return;

        }


        event.preventDefault();


        const position =
            getPosition(event);


        ctx.globalCompositeOperation =
            "destination-out";


        ctx.beginPath();


        ctx.arc(
            position.x,
            position.y,
            28,
            0,
            Math.PI * 2
        );


        ctx.fill();


        scratchedPoints++;


        if (
            scratchedPoints >=
            totalRequired
        ) {


            canvas.style.transition =
                "opacity 0.8s ease";


            canvas.style.opacity =
                "0";


            const hint =
                document.querySelector(
                    ".scratch-hint"
                );


            if (hint) {


                hint.style.opacity =
                    "0";


            }


        }


    }


    /* ------------------------------------------
       MOUSE
    ------------------------------------------ */

    canvas.addEventListener(
        "mousedown",
        function(event) {


            scratching =
                true;


            scratch(event);


        }
    );


    canvas.addEventListener(
        "mousemove",
        scratch
    );


    window.addEventListener(
        "mouseup",
        function() {


            scratching =
                false;


        }
    );


    /* ------------------------------------------
       TOUCH
    ------------------------------------------ */

    canvas.addEventListener(
        "touchstart",
        function(event) {


            scratching =
                true;


            scratch(event);


        },
        {
            passive: false
        }
    );


    canvas.addEventListener(
        "touchmove",
        scratch,
        {
            passive: false
        }
    );


    window.addEventListener(
        "touchend",
        function() {


            scratching =
                false;


        }
    );


}

</script>


</body>

</html>
