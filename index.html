<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shashank & Jyoti | Wedding Invitation</title>

<style>

/* ==============================
   BASIC
============================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #0b0806;
    color: #ffffff;
    font-family: Georgia, "Times New Roman", serif;
}


/* ==============================
   OPENING
============================== */

.opening {

    position: relative;

    width: 100%;
    height: 100vh;
    height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(120, 80, 35, 0.25),
            rgba(0, 0, 0, 0.96) 75%
        ),
        linear-gradient(
            135deg,
            #21160d,
            #080706 55%,
            #160e08
        );

    opacity: 1;
    transform: scale(1);
}

.opening::before {

    content: "";

    position: absolute;

    width: 80vw;
    height: 80vw;

    max-width: 700px;
    max-height: 700px;

    border-radius: 50%;

    background:
        rgba(180, 130, 70, 0.08);

    filter: blur(80px);

    animation:
        glow 5s ease-in-out infinite alternate;
}

.opening-content {

    position: relative;

    z-index: 2;

    width: 90%;
    max-width: 750px;

    animation:
        fadeUp 1.8s ease forwards;
}

.ganesh {

    font-size: 18px;

    letter-spacing: 2px;

    margin-bottom: 22px;

    opacity: 0.95;
}

.mantra {

    font-size: 15px;

    line-height: 2;

    letter-spacing: 0.5px;

    margin-bottom: 35px;

    opacity: 0.85;
}

.invite {

    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 3px;

    text-transform: uppercase;

    opacity: 0.7;

    margin-bottom: 20px;
}

.names {

    font-size:
        clamp(32px, 8vw, 68px);

    font-weight: normal;

    letter-spacing: 2px;

    line-height: 1.15;

    margin-bottom: 15px;

    text-shadow:
        0 4px 25px rgba(0,0,0,0.8);
}

.ampersand {

    font-style: italic;

    font-size: 0.55em;

    margin: 0 8px;

    opacity: 0.8;
}

.subtitle {

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 4px;

    opacity: 0.65;

    margin-bottom: 45px;
}

.open-btn {

    border:
        1px solid rgba(255,255,255,0.5);

    background:
        rgba(255,255,255,0.05);

    color: white;

    padding:
        15px 32px;

    font-family:
        Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 3px;

    cursor: pointer;

    transition:
        all 0.4s ease;

    backdrop-filter:
        blur(5px);
}

.open-btn:hover {

    background:
        rgba(255,255,255,0.15);

    border-color:
        white;

    transform:
        scale(1.04);
}

.open-btn:active {

    transform:
        scale(0.97);
}

.bottom-line {

    position: absolute;

    bottom: 25px;

    left: 50%;

    transform:
        translateX(-50%);

    font-family:
        Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 3px;

    opacity: 0.35;

    z-index: 2;

    white-space: nowrap;
}


/* ==============================
   INVITATION
============================== */

.invitation-section {

    min-height: 100vh;
    min-height: 100dvh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 35px;

    background:

        radial-gradient(
            circle at center,
            rgba(120, 80, 35, 0.20),
            #0b0806 70%
        );

    animation:
        invitationFade 2s ease forwards;
}

.invitation-small {

    font-family:
        Arial, sans-serif;

    font-size: 12px;

    letter-spacing: 1px;

    line-height: 1.8;

    opacity: 0.7;

    margin-bottom: 18px;

    max-width: 650px;
}

.invitation-text {

    font-size: 18px;

    line-height: 1.7;

    opacity: 0.9;

    margin-bottom: 45px;

    max-width: 650px;
}

.couple-name {

    font-size:
        clamp(48px, 10vw, 90px);

    letter-spacing: 3px;

    line-height: 1.1;

    font-weight: normal;

    text-shadow:
        0 5px 30px rgba(0,0,0,0.8);
}

.couple-and {

    font-size: 30px;

    font-style: italic;

    margin:
        15px 0;

    opacity: 0.7;
}


/* ==============================
   SAVE THE DATE
============================== */

.save-date {

    min-height: 100vh;
    min-height: 100dvh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 30px;

    background:

        radial-gradient(
            circle at center,
            rgba(130, 85, 35, 0.22),
            #090705 72%
        );

    animation:
        saveDateFade 1.8s ease forwards;
}

.save-title {

    font-family:
        Arial, sans-serif;

    font-size: 12px;

    letter-spacing: 5px;

    opacity: 0.65;

    margin-bottom: 18px;
}

.save-subtitle {

    font-size: 18px;

    line-height: 1.6;

    opacity: 0.85;

    margin-bottom: 35px;
}


/* ==============================
   SCRATCH CARD
============================== */

.scratch-container {

    position: relative;

    width: min(330px, 85vw);

    height: 360px;

    overflow: hidden;

    border:
        1px solid rgba(255,255,255,0.25);

    border-radius: 4px;

    background:
        linear-gradient(
            145deg,
            #17110c,
            #302116,
            #120d09
        );

    box-shadow:
        0 20px 60px rgba(0,0,0,0.55);
}


/* Date underneath */

.date-reveal {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    z-index: 1;
}

.date-month {

    font-family:
        Arial, sans-serif;

    font-size: 18px;

    letter-spacing: 7px;

    margin-left: 7px;

    opacity: 0.8;
}

.date-day {

    font-size: 100px;

    line-height: 1;

    margin: 12px 0;

    font-weight: normal;
}

.date-year {

    font-family:
        Arial, sans-serif;

    font-size: 20px;

    letter-spacing: 6px;

    margin-left: 6px;

    opacity: 0.75;
}


/* Scratch Canvas */

#scratchCanvas {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    z-index: 5;

    cursor: crosshair;

    touch-action: none;
}


/* Scratch instruction */

.scratch-hint {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 6;

    pointer-events: none;

    font-family:
        Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 2px;

    opacity: 0.75;

    width: 90%;
}


/* ==============================
   ANIMATIONS
============================== */

@keyframes fadeUp {

    from {

        opacity: 0;

        transform:
            translateY(30px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}

@keyframes glow {

    from {

        transform:
            scale(0.9);

        opacity: 0.5;
    }

    to {

        transform:
            scale(1.1);

        opacity: 1;
    }
}

@keyframes invitationFade {

    from {

        opacity: 0;

        transform:
            scale(0.97);
    }

    to {

        opacity: 1;

        transform:
            scale(1);
    }
}

@keyframes saveDateFade {

    from {

        opacity: 0;

        transform:
            scale(0.97);
    }

    to {

        opacity: 1;

        transform:
            scale(1);
    }
}


/* ==============================
   MOBILE
============================== */

@media (max-width: 600px) {

    .ganesh {

        font-size: 16px;

        margin-bottom: 16px;
    }

    .mantra {

        font-size: 13px;

        line-height: 1.8;

        margin-bottom: 28px;
    }

    .invite {

        font-size: 9px;

        letter-spacing: 2px;

        line-height: 1.7;
    }

    .names {

        font-size: 34px;

        letter-spacing: 1px;
    }

    .subtitle {

        font-size: 9px;

        letter-spacing: 3px;

        margin-bottom: 35px;
    }

    .open-btn {

        padding:
            14px 25px;

        font-size: 10px;

        letter-spacing: 2px;
    }

    .bottom-line {

        bottom: 18px;

        font-size: 8px;

        letter-spacing: 2px;
    }

    .invitation-section {

        padding:
            25px 20px;
    }

    .invitation-small {

        font-size: 11px;

        line-height: 1.7;
    }

    .invitation-text {

        font-size: 16px;

        line-height: 1.7;

        margin-bottom: 38px;
    }

    .couple-name {

        font-size: 50px;

        letter-spacing: 2px;
    }

    .couple-and {

        font-size: 25px;

        margin:
            12px 0;
    }

    .save-subtitle {

        font-size: 16px;
    }

    .scratch-container {

        width: 300px;

        height: 330px;
    }

    .date-day {

        font-size: 90px;
    }

}


/* ==============================
   HIDE
============================== */

.hidden {
    display: none !important;
}

</style>
</head>


<body>


<!-- =========================================
     OPENING
========================================= -->

<section
    class="opening"
    id="opening">

    <div
        class="opening-content">

        <div class="ganesh">

            ॥ श्री गणेशाय नमः ॥

        </div>

        <div class="mantra">

            वक्रतुण्ड महाकाय सूर्यकोटि समप्रभ।<br>

            निर्विघ्नं कुरु मे देव सर्वकार्येषु सर्वदा॥

        </div>

        <div class="invite">

            With the blessings of Shri Ganesh
            and our beloved families

        </div>

        <div class="names">

            Shashank

            <span class="ampersand">
                &
            </span>

            Jyoti

        </div>

        <div class="subtitle">

            WEDDING INVITATION

        </div>

        <button
            class="open-btn"
            id="openInvitation">

            OPEN INVITATION

        </button>

    </div>

    <div class="bottom-line">

        21 NOVEMBER 2026

    </div>

</section>



<!-- =========================================
     JAVASCRIPT
========================================= -->

<script>


/* =========================================
   OPEN INVITATION
========================================= */

const openButton =
    document.getElementById(
        "openInvitation"
    );

const opening =
    document.getElementById(
        "opening"
    );


openButton.addEventListener(
    "click",
    function() {


        opening.style.transition =
            "opacity 1.5s ease, transform 1.5s ease";


        opening.style.opacity =
            "0";


        opening.style.transform =
            "scale(1.04)";


        setTimeout(
            function() {


                opening.style.display =
                    "none";


                document.body.style.overflow =
                    "auto";


                showInvitation();


            },
            1500
        );

    }
);



/* =========================================
   SHOW INVITATION
========================================= */

function showInvitation() {


    const invitation =
        document.createElement(
            "section"
        );


    invitation.className =
        "invitation-section";


    invitation.id =
        "invitationSection";


    invitation.innerHTML = `

        <div class="invitation-small">

            With the blessings of Shri Ganesh
            and our beloved families,

        </div>


        <div class="invitation-text">

            we joyfully invite you
            to celebrate the union of

        </div>


        <div class="couple-name">

            Shashank

        </div>


        <div class="couple-and">

            &

        </div>


        <div class="couple-name">

            Jyoti

        </div>

    `;


    document.body.appendChild(
        invitation
    );


    setTimeout(
        function() {

            invitation.style.transition =
                "opacity 1.2s ease";

            invitation.style.opacity =
                "0";


            setTimeout(
                function() {

                    invitation.remove();

                    showSaveDate();

                },
                1200
            );

        },
        4500
    );

}



/* =========================================
   SAVE THE DATE
========================================= */

function showSaveDate() {


    const saveDate =
        document.createElement(
            "section"
        );


    saveDate.className =
        "save-date";


    saveDate.id =
        "saveDate";


    saveDate.innerHTML = `

        <div class="save-title">

            SAVE THE DATE

        </div>


        <div class="save-subtitle">

            Scratch below to reveal our wedding date

        </div>


        <div class="scratch-container">

            <div class="date-reveal">

                <div class="date-month">

                    NOVEMBER

                </div>


                <div class="date-day">

                    21

                </div>


                <div class="date-year">

                    2026

                </div>

            </div>


            <canvas
                id="scratchCanvas">
            </canvas>


            <div class="scratch-hint">

                SCRATCH HERE

            </div>

        </div>

    `;


    document.body.appendChild(
        saveDate
    );


    setupScratch();

}



/* =========================================
   SCRATCH EFFECT
========================================= */

function setupScratch() {


    const canvas =
        document.getElementById(
            "scratchCanvas"
        );


    const container =
        document.querySelector(
            ".scratch-container"
        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    const rect =
        container.getBoundingClientRect();


    const width =
        Math.floor(rect.width);


    const height =
        Math.floor(rect.height);


    const devicePixelRatio =
        window.devicePixelRatio || 1;


    canvas.width =
        width * devicePixelRatio;


    canvas.height =
        height * devicePixelRatio;


    canvas.style.width =
        width + "px";


    canvas.style.height =
        height + "px";


    ctx.scale(
        devicePixelRatio,
        devicePixelRatio
    );


    /* Scratch surface */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            width,
            height
        );


    gradient.addColorStop(
        0,
        "#5a4632"
    );

    gradient.addColorStop(
        0.5,
        "#8b7355"
    );

    gradient.addColorStop(
        1,
        "#4a3828"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* Decorative text */

    ctx.fillStyle =
        "rgba(255,255,255,0.18)";


    ctx.font =
        "12px Arial";


    ctx.textAlign =
        "center";


    ctx.fillText(
        "SCRATCH TO REVEAL",
        width / 2,
        height / 2 - 25
    );


    ctx.font =
        "28px Georgia";


    ctx.fillStyle =
        "rgba(255,255,255,0.22)";


    ctx.fillText(
        "21",
        width / 2,
        height / 2 + 25
    );


    let scratching =
        false;


    let scratchedPoints =
        0;


    const totalRequired =
        70;


    function getPosition(event) {


        const bounds =
            canvas.getBoundingClientRect();


        let clientX;
        let clientY;


        if (
            event.touches &&
            event.touches.length
        ) {

            clientX =
                event.touches[0].clientX;

            clientY =
                event.touches[0].clientY;

        } else {

            clientX =
                event.clientX;

            clientY =
                event.clientY;

        }


        return {

            x:
                clientX -
                bounds.left,

            y:
                clientY -
                bounds.top

        };

    }


    function scratch(event) {


        if (!scratching) {
            return;
        }


        event.preventDefault();


        const position =
            getPosition(event);


        ctx.globalCompositeOperation =
            "destination-out";


        ctx.beginPath();


        ctx.arc(
            position.x,
            position.y,
            28,
            0,
            Math.PI * 2
        );


        ctx.fill();


        scratchedPoints++;


        if (
            scratchedPoints >=
            totalRequired
        ) {

            canvas.style.transition =
                "opacity 0.8s ease";


            canvas.style.opacity =
                "0";


            const hint =
                document.querySelector(
                    ".scratch-hint"
                );


            if (hint) {

                hint.style.opacity =
                    "0";

            }

        }

    }


    /* Mouse */

    canvas.addEventListener(
        "mousedown",
        function(event) {

            scratching = true;

            scratch(event);

        }
    );


    canvas.addEventListener(
        "mousemove",
        scratch
    );


    window.addEventListener(
        "mouseup",
        function() {

            scratching = false;

        }
    );


    /* Touch */

    canvas.addEventListener(
        "touchstart",
        function(event) {

            scratching = true;

            scratch(event);

        },
        {
            passive: false
        }
    );


    canvas.addEventListener(
        "touchmove",
        scratch,
        {
            passive: false
        }
    );


    window.addEventListener(
        "touchend",
        function() {

            scratching = false;

        }
    );

}

</script>

</body>
</html>
